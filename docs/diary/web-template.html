<title>My Portfolio Website Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one reading column, contents list up top, each day as its own block */
:root { --bg:#f3f1ec; --surface:#e8e5de; --fg:#24262a; --muted:#5d6068; --gold:#9a7424; --forest:#2f5a45; --line:#d6d1c6;
  --display:"Newsreader", Georgia, serif; --body:"Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1d1f22; --surface:#26292d; --fg:#e9e6df; --muted:#a6a39b; --gold:#d6ab52; --forest:#7fb89a; --line:#3a3d42; color-scheme:dark } }
:root[data-theme="dark"] { --bg:#1d1f22; --surface:#26292d; --fg:#e9e6df; --muted:#a6a39b; --gold:#d6ab52; --forest:#7fb89a; --line:#3a3d42; color-scheme:dark }
body { background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:32px 64px; }
main { max-width:68ch; margin:0 auto; }
.masthead { border-bottom:2px solid var(--gold); padding-bottom:16px; margin-bottom:24px; }
.masthead p { margin:0; color:var(--muted); font-size:0.9rem; letter-spacing:0.06em; text-transform:uppercase; }
.masthead h1 { font-family:var(--display); font-weight:600; font-size:clamp(2rem, 6vw, 2.8rem); margin:4px 0 0; line-height:1.1; text-wrap:balance; }
nav#TOC { background:var(--surface); border-radius:6px; padding:12px 16px; margin-bottom:32px; font-size:0.95rem; }
nav#TOC ul { list-style:none; margin:0; padding-left:0; } nav#TOC ul ul { padding-left:16px; }
nav#TOC a { color:var(--fg); text-decoration:none; } nav#TOC a:hover, nav#TOC a:focus-visible { color:var(--forest); text-decoration:underline; }
h1, h2 { font-family:var(--display); font-weight:600; text-wrap:balance; }
main > h1 { font-size:1.9rem; margin:48px 0 8px; color:var(--gold); }
h2 { font-size:1.35rem; margin:32px 0 8px; }
h1#daily-entries ~ h2 { border-top:1px solid var(--line); padding-top:24px; }
a { color:var(--forest); } a:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
li { margin:6px 0; } ul, ol { padding-left:20px; }
li strong { color:var(--forest); }
.table-wrap { overflow-x:auto; } table { border-collapse:collapse; width:100%; font-size:0.92rem; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
th { border-bottom:2px solid var(--gold); }
code { font-size:0.88em; background:var(--surface); padding:1px 4px; border-radius:3px; overflow-wrap:anywhere; }
</style>
<main>
<header class="masthead"><p>Project Diary</p><h1>My Portfolio Website</h1></header>
$if(toc)$<nav id="TOC" aria-label="Contents">$table-of-contents$</nav>$endif$
$body$
</main>
